[project]
name = "irp-meta-learning"
version = "0.1.0"
description = "Meta-learning optimisation strategies for full-waveform inversion"
authors = [
{ name = "Francesco Remondi" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
"jax",
"jaxlib",
"equinox",
"optax",
"numpy",
"scipy",
"matplotlib",
"h5py"
]

[project.optional-dependencies]
devito = [
    "devito"
]
stride = [
    "stride @ git+https://github.com/trustimaging/stride.git"
]
dev = [
"black==25.1.0",
"ruff",
"pytest"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# -------------------------

# Black (formatter)

# -------------------------

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = false

# -------------------------

# Ruff (linter)

# -------------------------

[tool.ruff]
line-length = 88
target-version = "py310"
