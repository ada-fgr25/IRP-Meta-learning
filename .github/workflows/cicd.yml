name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black==25.1.0 ruff
      - name: Black
        run: black --check --diff .
      - name: Ruff
        run: ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install build
      - name: Build distribution artifacts
        run: python -m build --sdist --wheel

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Check for tests directory
        id: tests
        run: |
          if [ -d tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install package and test dependencies
        if: steps.tests.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run pytest
        if: steps.tests.outputs.present == 'true'
        run: pytest tests/
      - name: Skip tests
        if: steps.tests.outputs.present != 'true'
        run: echo "No tests/ directory found; skipping pytest."

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-docs.txt
      - name: Build docs (warnings as errors)
        run: sphinx-build -b html -W docs docs/_build/html
      - name: Upload docs HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
